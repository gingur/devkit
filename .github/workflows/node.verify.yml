name: Verify (legacy Node entrypoint)

on:
  workflow_call:
    inputs:
      node:
        description: 'Node.js version override. Prefer .nvmrc.'
        type: string
        required: false
        default: ''
      pnpm:
        description: 'pnpm version override. Prefer package.json packageManager/devEngines.'
        type: string
        required: false
        default: ''
      bun:
        description: 'Deprecated compatibility flag; Bun is auto-detected from repo version files.'
        type: boolean
        required: false
        default: false
      bun_version:
        description: 'Optional Bun version override.'
        type: string
        required: false
        default: ''
      cwd:
        description: 'Directory containing package.json.'
        type: string
        required: false
        default: '.'
      lint:
        description: 'pnpm script to run for lint. Empty skips lint.'
        type: string
        required: false
        default: 'lint'
      typecheck:
        description: 'pnpm script to run for typecheck. Empty skips typecheck.'
        type: string
        required: false
        default: 'typecheck'
      test:
        description: 'pnpm script to run for tests. Empty skips tests.'
        type: string
        required: false
        default: 'test'
      build:
        description: 'pnpm script to run for build. Empty skips build.'
        type: string
        required: false
        default: ''
      runner:
        description: 'Runner label.'
        type: string
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/toolchain.verify.yml
    with:
      cwd: ${{ inputs.cwd }}
      node: ${{ inputs.node }}
      pnpm: ${{ inputs.pnpm }}
      bun: ${{ inputs.bun_version }}
      lint: ${{ inputs.lint }}
      typecheck: ${{ inputs.typecheck }}
      test: ${{ inputs.test }}
      build: ${{ inputs.build }}
      runner: ${{ inputs.runner }}
