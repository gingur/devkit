name: Verify

on:
  workflow_call:
    inputs:
      node:
        description: 'Node.js version (optional override). Empty means read from .nvmrc.'
        type: string
        required: false
        default: ''
      pnpm:
        description: 'pnpm version (optional override). Empty means read from packageManager field.'
        type: string
        required: false
        default: ''
      bun:
        description: 'Bun version to install. Empty disables Bun setup.'
        type: string
        required: false
        default: ''
      cwd:
        description: 'Directory containing package.json'
        type: string
        required: false
        default: '.'
      lint:
        description: 'pnpm script to run for lint. Empty skips lint.'
        type: string
        required: false
        default: 'lint'
      typecheck:
        description: 'pnpm script to run for typecheck. Empty skips typecheck.'
        type: string
        required: false
        default: 'typecheck'
      test:
        description: 'pnpm script to run for tests. Empty skips tests.'
        type: string
        required: false
        default: 'test'
      build:
        description: 'pnpm script to run for build. Empty skips build.'
        type: string
        required: false
        default: ''
      runner:
        description: 'Runner label'
        type: string
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.cwd }}
    steps:
      - uses: actions/checkout@v6

      - uses: gingur/devkit/actions/node.setup@main
        with:
          node: ${{ inputs.node }}
          pnpm: ${{ inputs.pnpm }}

      - name: Setup Bun
        if: ${{ inputs.bun != '' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun }}

      - name: Lint
        if: ${{ inputs.lint != '' }}
        run: pnpm ${{ inputs.lint }}

      - name: Typecheck
        if: ${{ inputs.typecheck != '' }}
        run: pnpm ${{ inputs.typecheck }}

      - name: Test
        if: ${{ inputs.test != '' }}
        run: pnpm ${{ inputs.test }}

      - name: Build
        if: ${{ inputs.build != '' }}
        run: pnpm ${{ inputs.build }}
