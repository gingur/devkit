# .github/workflows/infisical.secrets.scan.yml
name: Secret scan

on:
  workflow_call:
    inputs:
      config:
        description: 'Path to an infisical-scan.toml override (optional; defaults to devkit bundled config)'
        type: string
        required: false
        default: ''
      runner:
        description: 'Runner label'
        type: string
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  scan:
    # A fork pull request never allocates a self-hosted runner: on a public repo
    # that would run contributor code on the operator's machine. Forks fall back
    # to GitHub-hosted rather than skipping, so they are still checked.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the diff range resolves

      - uses: gingur/devkit/actions/infisical.secrets.scan@main
        with:
          config: ${{ inputs.config }}
