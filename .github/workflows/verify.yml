name: Verify
# devkit's own CI.
#
# Everything under actions/, configs/ and .github/workflows/ ships to every
# enrolled repo on `@main`, so a regression here lands fleet-wide the moment it
# merges — there is no staging step between this repo and production. Keep the
# `actions` guard cheap and network-free so it can't false-fail a consumer's
# deploy; `configs` needs an install, so it runs as its own job.
on:
  pull_request:
    paths:
      - 'actions/**'
      - 'configs/**'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actions:
    name: Actions
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Catches shell breakage in composite actions before it ships fleet-wide.
      # No-op until a composite adds a *.sh; kept so the guard exists the moment
      # one does.
      - name: Shell syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'actions/**/*.sh')
          printf 'checking %s shell file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done

  # Dogfoods the reusable workflow, so the `format` input is exercised on every
  # PR that touches what it gates. devkit declares no runtime version files of
  # its own — it is a config package, not an app — so the versions are explicit.
  configs:
    name: Configs
    uses: ./.github/workflows/toolchain.verify.yml
    with:
      node: '22.23.2'
      pnpm: '10.33.0'
      format: 'fmt:check'
      typecheck: ''
      test: ''
      build: ''
