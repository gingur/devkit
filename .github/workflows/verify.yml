name: Verify
# devkit's own CI.
#
# Everything under actions/ ships to every enrolled repo on `@main`, so a
# regression here lands fleet-wide the moment it merges — there is no staging
# step between this repo and production. Keep the guards here cheap and
# network-free so they can't false-fail a consumer's deploy.
on:
  pull_request:
    paths:
      - 'actions/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  actions:
    name: Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Catches shell breakage in composite actions before it ships fleet-wide.
      # No-op until a composite adds a *.sh; kept so the guard exists the moment
      # one does.
      - name: Shell syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'actions/**/*.sh')
          printf 'checking %s shell file(s)\n' "${#files[@]}"
          for f in "${files[@]}"; do bash -n "$f"; done
