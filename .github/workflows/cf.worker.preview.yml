name: Preview Cloudflare Worker

on:
  workflow_call:
    inputs:
      app:
        description: 'Base worker name; the preview worker is <app>-pr-<N>'
        type: string
        required: true
      domain:
        description: 'Base domain for previews; the URL is pr-<N>.<domain>'
        type: string
        required: true
      cfZone:
        description: 'Cloudflare zone ID for <domain>'
        type: string
        required: true
      cwd:
        type: string
        required: false
        default: '.'
      build:
        type: string
        required: false
        default: 'pnpm build'
      node:
        type: string
        required: false
        default: ''
      pnpm:
        type: string
        required: false
        default: ''
      runner:
        description: 'Runner label. A self-hosted runner is only reachable for same-repository pull requests; see the job guard below.'
        type: string
        required: false
        default: 'ubuntu-latest'
      infisicalDomain:
        description: 'Infisical instance URL. The private origin for the Gingur box vault; https://app.infisical.com for Infisical Cloud.'
        type: string
        required: true
      infisicalProject:
        type: string
        required: true
      infisicalEnv:
        type: string
        required: true
      infisicalPath:
        type: string
        required: true
      infisicalIdentity:
        type: string
        required: true

# Last push wins: a new preview deploy cancels any in-flight one for this PR.
concurrency:
  group: cf-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  deploy:
    # A fork pull request must never allocate a self-hosted runner: on a public
    # repository that would execute contributor code on the operator's machine.
    # Nothing is lost by skipping it — GitHub already refuses `id-token: write`
    # and passes no secrets to fork-originated runs, so the Infisical fetch in
    # this job could never have succeeded for a fork. Skipping fails fast
    # instead of failing inside an allocated runner.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/cf.worker.deploy.yml
    with:
      runner: ${{ inputs.runner }}
      env: preview
      worker: ${{ inputs.app }}-pr-${{ github.event.pull_request.number }}
      cwd: ${{ inputs.cwd }}
      build: ${{ inputs.build }}
      node: ${{ inputs.node }}
      pnpm: ${{ inputs.pnpm }}
      infisicalDomain: ${{ inputs.infisicalDomain }}
      infisicalProject: ${{ inputs.infisicalProject }}
      infisicalEnv: ${{ inputs.infisicalEnv }}
      infisicalPath: ${{ inputs.infisicalPath }}
      infisicalIdentity: ${{ inputs.infisicalIdentity }}
    secrets: inherit

  domain:
    needs: deploy
    # A fork pull request must never allocate a self-hosted runner: on a public
    # repository that would execute contributor code on the operator's machine.
    # Nothing is lost by skipping it — GitHub already refuses `id-token: write`
    # and passes no secrets to fork-originated runs, so the Infisical fetch in
    # this job could never have succeeded for a fork. Skipping fails fast
    # instead of failing inside an allocated runner.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runner }}
    # Same GitHub Environment as the deploy job, so the whole preview lifecycle
    # authenticates to Infisical under one OIDC subject: ...:environment:preview.
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      WORKER: ${{ inputs.app }}-pr-${{ github.event.pull_request.number }}
      HOST: pr-${{ github.event.pull_request.number }}.${{ inputs.domain }}
    steps:
      - name: Fetch CF credentials
        uses: gingur/devkit/actions/infisical.secrets.fetch@main
        with:
          domain: ${{ inputs.infisicalDomain }}
          identity: ${{ inputs.infisicalIdentity }}
          project: ${{ inputs.infisicalProject }}
          env: ${{ inputs.infisicalEnv }}
          path: ${{ inputs.infisicalPath }}

      - name: Attach custom domain
        uses: gingur/devkit/actions/cf.worker.domain@main
        with:
          mode: attach
          token: ${{ env.CLOUDFLARE_API_TOKEN }}
          account: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          zone: ${{ inputs.cfZone }}
          hostname: ${{ env.HOST }}
          service: ${{ env.WORKER }}

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: cf-preview
          message: |
            🔎 **Preview deployed** → https://${{ env.HOST }}

            Worker `${{ env.WORKER }}` · updates on each push · removed when this PR closes.
