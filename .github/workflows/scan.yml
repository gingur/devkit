# .github/workflows/scan.yml
name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    # A fork pull request never allocates a self-hosted runner: on a public repo
    # that would run contributor code on the operator's machine. Forks fall back
    # to GitHub-hosted rather than skipping, so they are still checked.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./actions/infisical.secrets.scan
