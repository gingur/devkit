name: Cleanup Cloudflare Worker preview

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      domain:
        type: string
        required: true
      cfZone:
        type: string
        required: true
      runner:
        description: 'Runner label. A self-hosted runner is only reachable for same-repository pull requests; see the job guard below.'
        type: string
        required: false
        default: 'ubuntu-latest'
      infisicalDomain:
        description: 'Infisical instance URL. The private origin for the Gingur box vault; https://app.infisical.com for Infisical Cloud.'
        type: string
        required: true
      infisicalProject:
        type: string
        required: true
      infisicalEnv:
        type: string
        required: true
      infisicalPath:
        type: string
        required: true
      infisicalIdentity:
        type: string
        required: true

# Share the per-PR group with cf.worker.preview so closing a PR cancels any
# in-flight preview deploy before tearing down.
concurrency:
  group: cf-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  cleanup:
    # A fork pull request must never allocate a self-hosted runner: on a public
    # repository that would execute contributor code on the operator's machine.
    # Nothing is lost by skipping it — GitHub already refuses `id-token: write`
    # and passes no secrets to fork-originated runs, so the Infisical fetch in
    # this job could never have succeeded for a fork. Skipping fails fast
    # instead of failing inside an allocated runner.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runner }}
    # Match the preview deploy's GitHub Environment so teardown authenticates to
    # Infisical under the same OIDC subject: ...:environment:preview.
    environment: preview
    env:
      WORKER: ${{ inputs.app }}-pr-${{ github.event.pull_request.number }}
      HOST: pr-${{ github.event.pull_request.number }}.${{ inputs.domain }}
    steps:
      - name: Fetch CF credentials
        uses: gingur/devkit/actions/infisical.secrets.fetch@main
        with:
          domain: ${{ inputs.infisicalDomain }}
          identity: ${{ inputs.infisicalIdentity }}
          project: ${{ inputs.infisicalProject }}
          env: ${{ inputs.infisicalEnv }}
          path: ${{ inputs.infisicalPath }}

      - name: Detach custom domain
        uses: gingur/devkit/actions/cf.worker.domain@main
        with:
          mode: detach
          token: ${{ env.CLOUDFLARE_API_TOKEN }}
          account: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          zone: ${{ inputs.cfZone }}
          hostname: ${{ env.HOST }}

      - name: Delete preview worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name ${{ env.WORKER }}

      - name: Remove preview comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: cf-preview
          delete: true
