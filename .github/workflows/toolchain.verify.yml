name: Verify

on:
  workflow_call:
    inputs:
      cwd:
        description: 'Directory containing package.json and runtime version files.'
        type: string
        required: false
        default: '.'
      node:
        description: 'Optional Node.js override. Prefer repo-owned version files.'
        type: string
        required: false
        default: ''
      pnpm:
        description: 'Optional pnpm override. Prefer package.json packageManager/devEngines.'
        type: string
        required: false
        default: ''
      bun:
        description: 'Optional Bun override. Prefer .bun-version or package.json devEngines.'
        type: string
        required: false
        default: ''
      format:
        description: 'pnpm script to run for the format check. Empty skips it.'
        type: string
        required: false
        default: 'fmt:check'
      lint:
        description: 'pnpm script to run for lint. Empty skips lint.'
        type: string
        required: false
        default: 'lint'
      typecheck:
        description: 'pnpm script to run for typecheck. Empty skips typecheck.'
        type: string
        required: false
        default: 'typecheck'
      test:
        description: 'pnpm script to run for tests. Empty skips tests.'
        type: string
        required: false
        default: 'test'
      build:
        description: 'pnpm script to run for build. Empty skips build.'
        type: string
        required: false
        default: 'build'
      runner:
        description: 'Runner label.'
        type: string
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.cwd }}
    steps:
      - uses: actions/checkout@v6

      - uses: gingur/devkit/actions/toolchain.setup@main
        with:
          cwd: ${{ inputs.cwd }}
          node: ${{ inputs.node }}
          pnpm: ${{ inputs.pnpm }}
          bun: ${{ inputs.bun }}

      - name: Format
        if: ${{ inputs.format != '' }}
        run: pnpm ${{ inputs.format }}

      - name: Lint
        if: ${{ inputs.lint != '' }}
        run: pnpm ${{ inputs.lint }}

      - name: Typecheck
        if: ${{ inputs.typecheck != '' }}
        run: pnpm ${{ inputs.typecheck }}

      - name: Test
        if: ${{ inputs.test != '' }}
        run: pnpm ${{ inputs.test }}

      - name: Build
        if: ${{ inputs.build != '' }}
        run: pnpm ${{ inputs.build }}
